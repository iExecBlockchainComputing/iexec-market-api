name: docker publish API

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run in dry-run mode (the docker image will not be published)"
        default: false
        type: boolean
      tag:
        description: "Tag of Docker Image"
        default: "latest"
        type: string
      security-scan:
        description: "Run security scan on image"
        default: true
        type: boolean
    secrets:
      docker-username:
        description: "Docker registry username (required unless `dry-run: true`)"
        required: false
      docker-password:
        description: "Docker registry password or PAT (required unless `dry-run: true`)"
        required: false
      dockerhub-username:
        description: "DockerHub username for authenticated pulls (required when `dry-run: true`, unused otherwise as the push login already covers Docker Hub)"
        required: false
      dockerhub-password:
        description: "DockerHub password or PAT for authenticated pulls (required when `dry-run: true`, unused otherwise as the push login already covers Docker Hub)"
        required: false

jobs:
  # permissions are inherited from the caller job, which scopes them per event
  docker-publish: # zizmor: ignore[excessive-permissions]
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/docker-build.yml@71e6b9e61eefe6ca92540523ff2589274399b7cd # docker-build-v3.8.0
    with:
      image-name: "iexechub/iexec-market-api"
      registry: "docker.io"
      dockerfile: "api/Dockerfile"
      context: "api"
      security-scan: ${{ inputs.security-scan }}
      security-report: "sarif"
      hadolint: true
      push: ${{ !inputs.dry-run }}
      image-tag: ${{ inputs.tag }}
      attest: true
    secrets:
      username: ${{ secrets.docker-username }}
      password: ${{ secrets.docker-password }}
      dockerhub-username: ${{ secrets.dockerhub-username }}
      dockerhub-password: ${{ secrets.dockerhub-password }}
