name: docker publish API

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run in dry-run mode (the docker image will not be published)"
        default: false
        type: boolean
      tag:
        description: "Tag of Docker Image"
        default: "latest"
        type: string
    secrets:
      docker-username:
        description: "Docker registry username (required unless `dry-run: true`)"
        required: false
      docker-password:
        description: "Docker registry password or PAT (required unless `dry-run: true`)"
        required: false
      dockerhub-username:
        description: "DockerHub username (required for authenticated pulls)"
        required: true
      dockerhub-password:
        description: "DockerHub password or PAT (required for authenticated pulls)"
        required: true

jobs:
  docker-publish:
    uses: iExecBlockchainComputing/github-actions-workflows/.github/workflows/docker-build.yml@0b4bde3c948a886b7df750a3ccbda169102d94b4 # docker-build-v3.5.2
    with:
      image-name: "iexechub/iexec-market-api"
      registry: "docker.io"
      dockerfile: "api/Dockerfile"
      context: "api"
      security-scan: true
      security-report: "sarif"
      hadolint: true
      push: ${{ !inputs.dry-run }}
      image-tag: ${{ inputs.tag }}
    secrets:
      username: ${{ secrets.docker-username }}
      password: ${{ secrets.docker-password }}
      dockerhub-username: ${{ secrets.dockerhub-username }}
      dockerhub-password: ${{ secrets.dockerhub-password }}
