name: Watcher PR checks
on:
  pull_request:
    paths: ["watcher/**"]

concurrency:
  group: ${{ github.ref }}-watcher-pr-checks
  cancel-in-progress: true

permissions: {}

jobs:
  check-code:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "watcher/package-lock.json"

      - name: Install dependencies
        working-directory: watcher
        run: |
          npm ci
          npm run codegen

      - name: Check format
        working-directory: watcher
        run: npm run check-format

      - name: Lint
        working-directory: watcher
        run: npm run lint

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "watcher/package-lock.json"

      - name: Install dependencies
        working-directory: watcher
        run: |
          npm ci
          npm run codegen

      - name: Start e2e test stack
        working-directory: watcher
        run: npm run start-test-stack

      - name: Run tests
        working-directory: watcher
        run: npm test

  docker-dry-run:
    permissions:
      contents: read
      pull-requests: write # Hadolint/Trivy PR comments
      security-events: write # Trivy SARIF upload
    uses: ./.github/workflows/reusable-watcher-docker.yml
    with:
      dry-run: true
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN_PULL_ONLY }}
